name: Deploy Amaya Frontend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Verify Node version
        run: node -v

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Patch ajv-keywords for ajv 8 compatibility
        run: |
          find node_modules -path '*ajv-keywords/keywords/_formatLimit.js' -type f | while read F; do
            sed -i.bak 's/var format = formats\[name\];/var format = (formats \&\& formats[name]) || null;/' "$F" && rm -f "${F}.bak"
          done

      - name: Build React app
        run: CI=false npm run build

      - name: Add VPS to known hosts
        env:
          VPS_HOST: ${{ secrets.HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_USER: ${{ secrets.USER }}
          VPS_HOST: ${{ secrets.HOST }}
        run: |
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          rsync -avz --delete ./build/ $VPS_USER@$VPS_HOST:/home/amaya-boutique.com
